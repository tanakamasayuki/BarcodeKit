name=BarcodeKit
version=0.1.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Barcode and QR code generator for embedded systems, independent of any display library.
paragraph=Generates the logical black/white module pattern for Code 39, Code 93, Code 128, EAN-8, EAN-13, UPC-A, UPC-E, ITF, ITF-14, Codabar and QR Code. No dynamic allocation: you provide the buffer and its size is known at compile time. Rendering is up to you; the optional BarcodeKitDraw.h header adds LovyanGFX / M5GFX and Serial output with scale, centering and quiet-zone handling.
category=Communication
url=https://github.com/tanakamasayuki/BarcodeKit
architectures=*
includes=BarcodeKit.h
