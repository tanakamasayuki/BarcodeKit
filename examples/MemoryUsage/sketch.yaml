# No graphics library: this sketch only needs Serial, so it also builds for AVR.
profiles:
  m5stack_core:
    fqbn: esp32:esp32:m5stack_core
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../

  avr_uno:
    fqbn: arduino:avr:uno
    platforms:
      - platform: arduino:avr (1.8.8)
    libraries:
      - dir: ../../

default_profile: m5stack_core
